.avatar-connect-row{display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px;margin-top:-44px;position:relative;z-index:2;}
.avatar{width:88px;height:88px;border-radius:50%;background:#fff;border:4px solid #181818;overflow:hidden;display:flex;align-items:center;justify-content:center;}

.card-company{font-size:12px;color:#666;margin-top:2px;}
.info-list{display:flex;flex-direction:column;gap:10px;padding:18px 20px 26px;}
.info-row:hover{background:#333 !important;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#fff;color:#111;font-size:12px;font-weight:500;padding:8px 18px;border-radius:100px;opacity:0;transition:opacity 0.18s,transform 0.18s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
